<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>AlvaAR iOS 6DoF Pose Logger</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: monospace; background-color: #000; }
    #video { display: none; }
    #ui-overlay {
      position: absolute;
      top: 16px;
      left: 16px;
      background: rgba(0, 0, 0, 0.85);
      color: #00ffcc;
      padding: 14px;
      border-radius: 8px;
      z-index: 9999;
      font-size: 13px;
      line-height: 1.6;
      pointer-events: none;
    }
  </style>

  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
      }
    }
  </script>
</head>
<body>

  <div id="ui-overlay">
    <div><strong>AlvaAR iOS 6DoF Pose</strong></div>
    <div id="status">Status: Requesting Camera...</div>
    <div id="pos">Position: X: 0.00, Y: 0.00, Z: 0.00</div>
    <div id="rot">Rotation: P: 0.0°, Y: 0.0°, R: 0.0°</div>
  </div>

  <video id="video" playsinline webkit-playsinline></video>

  <script type="module">
    import * as THREE from 'three';
    import { AlvaAR } from 'https://cdn.jsdelivr.net/gh/alanross/AlvaAR@master/public/alva_ar.js';

    const video = document.getElementById('video');
    const statusDiv = document.getElementById('status');
    const posDiv = document.getElementById('pos');
    const rotDiv = document.getElementById('rot');

    async function startAR() {
      // 1. Request iPhone environment camera stream
      const stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
      });
      video.srcObject = stream;
      await video.play();

      const width = video.videoWidth;
      const height = video.videoHeight;

      // 2. Offscreen canvas to capture pixel frames for WebAssembly CV pipeline
      const canvas = document.createElement('canvas');
      canvas.width = width;
      canvas.height = height;
      const ctx = canvas.getContext('2d', { willReadFrequently: true });

      // 3. Initialize AlvaAR SLAM Engine
      statusDiv.textContent = "Status: Initializing SLAM...";
      const alva = await AlvaAR.Initialize(width, height);

      // 4. Setup Three.js Scene and Camera
      const scene = new THREE.Scene();
      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.01, 100);
      camera.matrixAutoUpdate = false; // Disable auto-updates to allow manual SLAM matrix overrides

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.domElement.style.position = 'absolute';
      renderer.domElement.style.top = '0';
      renderer.domElement.style.left = '0';
      document.body.appendChild(renderer.domElement);

      // Bind camera feed to background texture
      scene.background = new THREE.VideoTexture(video);

      // Add reference 3D cube placed at origin
      const cube = new THREE.Mesh(
        new THREE.BoxGeometry(0.15, 0.15, 0.15),
        new THREE.MeshNormalMaterial()
      );
      cube.position.set(0, 0, -0.5);
      scene.add(cube);

      // Matrix decomposition variables
      const posVec = new THREE.Vector3();
      const quatVec = new THREE.Quaternion();
      const scaleVec = new THREE.Vector3();

      // 5. Processing and Pose Logging Loop
      function loop() {
        requestAnimationFrame(loop);

        // Feed video frame array into AlvaAR SLAM finder
        ctx.drawImage(video, 0, 0, width, height);
        const frame = ctx.getImageData(0, 0, width, height);
        const cameraPose = alva.findCameraPose(frame);

        if (cameraPose) {
          statusDiv.textContent = "Status: Tracking Active";

          // Apply 16-element 4x4 camera pose matrix directly to Three.js camera
          camera.matrix.fromArray(cameraPose);
          camera.matrixWorldNeedsUpdate = true;

          // Decompose 4x4 transformation matrix into position vector and quaternion
          camera.matrix.decompose(posVec, quatVec, scaleVec);

          // Update position display (x, y, z in meters)
          posDiv.textContent = `Position (m): X: ${posVec.x.toFixed(2)}, Y: ${posVec.y.toFixed(2)}, Z: ${posVec.z.toFixed(2)}`;

          // Convert quaternion orientation into Euler angles (Pitch, Yaw, Roll in degrees)
          const euler = new THREE.Euler().setFromQuaternion(quatVec, 'YXZ');
          const pitch = THREE.MathUtils.radToDeg(euler.x).toFixed(1);
          const yaw = THREE.MathUtils.radToDeg(euler.y).toFixed(1);
          const roll = THREE.MathUtils.radToDeg(euler.z).toFixed(1);

          rotDiv.textContent = `Rotation (°): P: ${pitch}°, Y: ${yaw}°, R: ${roll}°`;
        } else {
          statusDiv.textContent = "Status: Searching for surface points...";
        }

        renderer.render(scene, camera);
      }

      loop();
    }

    startAR().catch(err => {
      statusDiv.textContent = `Error: ${err.message}`;
      console.error(err);
    });
  </script>
</body>
</html>
